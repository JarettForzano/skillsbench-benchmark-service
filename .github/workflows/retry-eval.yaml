name: retry-eval

on:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID for the smoke run.
        required: true
        default: 3d-scan-calc
        type: string
      dataset:
        description: Dataset for the smoke run.
        required: true
        default: with-skills
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: vals-ai/.github/.github/workflows/benchmark-service-smoke.yaml@main
    with:
      checkout_submodules: true
    secrets:
      VALKYRIE_AWS_ROLE_ARN: ${{ secrets.VALKYRIE_AWS_ROLE_ARN }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_API_KEY: ${{ secrets.NGROK_API_KEY }}
      NGROK_URL: ${{ secrets.NGROK_URL }}
      NGROK_PUBLIC_URL: ${{ secrets.NGROK_PUBLIC_URL }}
      SMOKE_DATASET: ${{ inputs.dataset || 'with-skills' }}
      SMOKE_TASK_ID: ${{ inputs.task_id || '3d-scan-calc' }}
      SMOKE_AGENT: ${{ secrets.SMOKE_AGENT }}
      SMOKE_MODEL: ${{ secrets.SMOKE_MODEL }}
      BENCHMARK_SERVICE_ENV: ${{ secrets.BENCHMARK_SERVICE_ENV }}

  retry-eval:
    needs: smoke
    uses: vals-ai/.github/.github/workflows/retry-eval.yaml@main
    with:
      benchmark_name: skillsbench
      checkout_submodules: true
      run_id: ${{ needs.smoke.outputs.valkyrie_run_id }}
    secrets:
      VALKYRIE_AWS_ROLE_ARN: ${{ secrets.VALKYRIE_AWS_ROLE_ARN }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_URL: ${{ secrets.NGROK_URL }}
      NGROK_PUBLIC_URL: ${{ secrets.NGROK_PUBLIC_URL }}
      SMOKE_DATASET: ${{ inputs.dataset || 'with-skills' }}
      BENCHMARK_SERVICE_ENV: ${{ secrets.BENCHMARK_SERVICE_ENV }}
